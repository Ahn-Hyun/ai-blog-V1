<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Bar chart illustrating the increase in commercial real estate borrowing costs, from 3% during the pandemic to current refinancing rates of 5.5% to 6%.">
