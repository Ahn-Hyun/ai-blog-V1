<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="Bar chart showing the State and Local Tax deduction cap at $10,000 currently, increasing to $40,000 from 2025 to 2029 under the OBBBA, and reverting to $10,000 in 2030.">
