<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Bar chart comparing the $1 trillion corporate debt coming due in 2026 to the $9.2 trillion US Treasury maturity wall.">
<rect width="100%" height="100%" fill="#ffffff" />
<text x="90" y="46" font-size="28" font-family="Arial, sans-serif" fill="#111827">2026 Debt Maturity Wall</text>
<line x1="90" y1="430" x2="950" y2="430" stroke="#9ca3af" stroke-width="2"/>
<line x1="90" y1="90" x2="90" y2="430" stroke="#9ca3af" stroke-width="2"/>
<line x1="90" y1="430.00" x2="950" y2="430.00" stroke="#e5e7eb" stroke-width="1"/>
<text x="78" y="435.00" text-anchor="end" font-size="13" font-family="Arial, sans-serif" fill="#6b7280">1 $ Trillions</text>
<line x1="90" y1="345.00" x2="950" y2="345.00" stroke="#e5e7eb" stroke-width="1"/>
<text x="78" y="350.00" text-anchor="end" font-size="13" font-family="Arial, sans-serif" fill="#6b7280">3.05 $ Trillions</text>
<line x1="90" y1="260.00" x2="950" y2="260.00" stroke="#e5e7eb" stroke-width="1"/>
<text x="78" y="265.00" text-anchor="end" font-size="13" font-family="Arial, sans-serif" fill="#6b7280">5.1 $ Trillions</text>
<line x1="90" y1="175.00" x2="950" y2="175.00" stroke="#e5e7eb" stroke-width="1"/>
<text x="78" y="180.00" text-anchor="end" font-size="13" font-family="Arial, sans-serif" fill="#6b7280">7.15 $ Trillions</text>
<line x1="90" y1="90.00" x2="950" y2="90.00" stroke="#e5e7eb" stroke-width="1"/>
<text x="78" y="95.00" text-anchor="end" font-size="13" font-family="Arial, sans-serif" fill="#6b7280">9.2 $ Trillions</text>
<rect x="176.00" y="430.00" width="258.00" height="0.00" fill="#2563eb" rx="4"/>
<text x="305.00" y="458" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#374151">Corporate Debt</text>
<rect x="606.00" y="90.00" width="258.00" height="340.00" fill="#2563eb" rx="4"/>
<text x="735.00" y="458" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#374151">US Treasury Debt</text>
</svg>