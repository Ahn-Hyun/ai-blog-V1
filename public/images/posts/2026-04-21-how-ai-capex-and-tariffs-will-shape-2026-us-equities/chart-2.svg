<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Bar chart showing the U.S. tariff rate on Chinese exports dropping from 31.1% in 2025 to 15% in 2026.">
